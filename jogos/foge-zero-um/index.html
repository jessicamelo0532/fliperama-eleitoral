<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foge, Zero-Um! · Fliperama Eleitoral</title>
  <meta name="description" content="Fuja da fiscalização pelos corredores do poder e veja, ao fim de cada fase, o que aconteceu na vida real.">
  <meta name="theme-color" content="#8A0000">
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header id="cabecalho" class="cabecalho"></header>

  <main>
    <div class="conteiner">
      <div id="barra-jogo" class="barra-jogo"></div>
      <div id="area-jogo" class="area-jogo moldura-pixel fzu">
        <div id="tela" class="fzu-tela" aria-live="polite"></div>

        <div id="palco" class="fzu-palco" hidden>
          <div id="hud" class="fzu-hud" aria-live="polite"></div>
          <div id="cena" class="fzu-cena">
            <canvas id="canvas" tabindex="0" role="img" aria-label="Labirinto do jogo"></canvas>
            <div id="aviso-cena" class="fzu-aviso" role="status" hidden></div>
          </div>
          <div class="fzu-direcional" aria-label="Direcional">
            <button type="button" class="fzu-tecla fzu-tecla--cima" data-direcao="0" aria-label="Andar para cima">▲</button>
            <button type="button" class="fzu-tecla fzu-tecla--esquerda" data-direcao="1" aria-label="Andar para a esquerda">◀</button>
            <button type="button" class="fzu-tecla fzu-tecla--direita" data-direcao="3" aria-label="Andar para a direita">▶</button>
            <button type="button" class="fzu-tecla fzu-tecla--baixo" data-direcao="2" aria-label="Andar para baixo">▼</button>
          </div>
          <div id="sobreposicao" class="fzu-sobreposicao" hidden></div>
        </div>
      </div>
    </div>
  </main>

  <footer id="rodape" class="rodape"></footer>

  <noscript><p style="text-align:center;padding:16px">Ative o JavaScript para jogar.</p></noscript>
  <script type="module" src="jogo.js"></script>
</body>
</html>
