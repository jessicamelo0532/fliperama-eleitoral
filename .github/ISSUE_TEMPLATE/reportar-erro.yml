name: Reportar erro de conteúdo
description: Informe uma informação incorreta, desatualizada ou com fonte quebrada.
title: "[Erro] "
labels: ["correção"]
body:
  - type: input
    id: link
    attributes:
      label: Link do jogo
      placeholder: https://jessicamelo0532.github.io/fliperama-eleitoral/jogos/...
    validations:
      required: true
  - type: textarea
    id: trecho
    attributes:
      label: Trecho com problema
      description: Copie o texto exatamente como aparece no jogo.
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de problema
      options:
        - Informação incorreta
        - Informação desatualizada
        - Fonte quebrada ou inacessível
        - Outro
    validations:
      required: true
  - type: textarea
    id: correcao
    attributes:
      label: Qual seria a informação correta?
  - type: input
    id: fonte
    attributes:
      label: Fonte que comprova
      placeholder: https://
